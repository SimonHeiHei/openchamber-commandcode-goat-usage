name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm ci

      # An OpenChamber guest package is never compiled by the host, so the built
      # bundle is committed. This job fails when it no longer matches its source.
      - name: The committed bundle must match a fresh build
        run: |
          npm run build
          git diff --exit-code panel/main.js

      - name: Syntax check the shipped scripts
        run: npm run check
