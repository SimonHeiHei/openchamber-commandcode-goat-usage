<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Goat</title>
<style>
  html, body { margin: 0; padding: 0; background: transparent; }
  body { font-size: 0.875rem; line-height: 1.45; -webkit-font-smoothing: antialiased; }
  [hidden] { display: none !important; }
  #root { padding: 12px 12px 20px; }

  .cg-shell { display: flex; flex-direction: column; gap: 12px; min-width: 0; }

  .cg-head { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
  .cg-head-top { display: flex; align-items: center; gap: 8px; min-width: 0; }
  .cg-spacer { flex: 1 1 auto; }
  .cg-refresh { display: inline-flex; flex: 0 0 auto; }
  .cg-plan { font-family: var(--oc-mono); font-size: 0.8125rem; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .cg-period { font-size: 0.75rem; color: var(--oc-muted); font-variant-numeric: tabular-nums; }

  @keyframes cg-spin { to { transform: rotate(360deg); } }
  .cg-iconbtn { -webkit-appearance: none; appearance: none; display: inline-flex; align-items: center; justify-content: center; width: 24px; height: 24px; padding: 0; margin: 0; border: 1px solid var(--oc-border); border-radius: 6px; background: var(--oc-elevated); color: var(--oc-muted); font: inherit; cursor: pointer; }
  .cg-iconbtn:hover:not(:disabled) { color: var(--oc-fg); background-image: linear-gradient(var(--oc-hover), var(--oc-hover)); }
  .cg-iconbtn:active:not(:disabled) { background-image: linear-gradient(var(--oc-active), var(--oc-active)); }
  .cg-iconbtn:focus-visible { outline: 2px solid var(--oc-focus); outline-offset: 1px; }
  .cg-iconbtn:disabled { opacity: 0.5; cursor: default; }
  .cg-iconbtn-ring { width: 12px; height: 12px; border: 2px solid var(--oc-border); border-top-color: var(--oc-primary); border-radius: 9999px; animation: cg-spin 0.8s linear infinite; }

  .cg-cards { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
  .cg-card { display: flex; flex-direction: column; gap: 2px; min-width: 0; padding: 8px 10px; border: 1px solid var(--oc-border); border-radius: var(--oc-radius); background: var(--oc-elevated); }
  .cg-card-label { font-size: 0.6875rem; color: var(--oc-muted); }
  .cg-card-value { font-size: clamp(0.9375rem, 0.7rem + 0.9vw, 1.125rem); font-weight: 600; line-height: 1.2; font-variant-numeric: tabular-nums; white-space: nowrap; overflow: hidden; }
  .cg-card-sub { font-size: 0.6875rem; color: var(--oc-muted); font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
  @media (min-width: 480px) { .cg-cards { grid-template-columns: repeat(4, minmax(0, 1fr)); } }

  .cg-bars { display: flex; flex-direction: column; gap: 12px; }
  .cg-bar { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
  .cg-bar-sub { font-size: 0.75rem; color: var(--oc-muted); font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }

  .cg-section { display: flex; flex-direction: column; gap: 8px; min-width: 0; }
  .cg-sec-head { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; }
  .cg-sec-title { font-size: 0.8125rem; font-weight: 600; }
  .cg-sec-note { font-size: 0.75rem; color: var(--oc-muted); font-variant-numeric: tabular-nums; }
  .cg-tabs { display: flex; min-width: 0; }

  .cg-stats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; padding: 8px 12px; border: 1px solid var(--oc-border); border-radius: var(--oc-radius); background: var(--oc-elevated); }
  .cg-stat { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
  .cg-stat-label { font-size: 0.6875rem; color: var(--oc-muted); }
  .cg-stat-value { font-size: 0.875rem; font-weight: 600; font-variant-numeric: tabular-nums; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .cg-stats-note { font-size: 0.6875rem; color: var(--oc-muted); font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
  .cg-note { font-size: 0.6875rem; color: var(--oc-muted); overflow-wrap: anywhere; }

  /* local cost charts */
  .cg-chart { display: flex; flex-direction: column; gap: 8px; min-width: 0; }

  .cg-legend { display: flex; flex-wrap: wrap; gap: 4px 10px; min-width: 0; }
  .cg-lg-item { position: relative; display: inline-block; max-width: 100%; padding-left: 12px; font-size: 0.6875rem; line-height: 1.3; color: var(--oc-muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .cg-lg-item::before { content: ''; position: absolute; left: 0; top: 50%; width: 8px; height: 8px; margin-top: -4px; border-radius: 2px; background: var(--cg-color, var(--oc-muted)); }

  .cg-cols { display: flex; align-items: flex-end; gap: 4px; min-width: 0; }
  .cg-col { display: flex; flex: 1 1 0; flex-direction: column; gap: 2px; min-width: 0; }
  .cg-stack { --cg-bar-w: 16px; --cg-bar-radius: calc(var(--cg-bar-w) / 8); display: flex; flex-direction: column-reverse; align-items: center; justify-content: flex-start; height: var(--cg-plot, 96px); border-bottom: 1px solid var(--oc-border); overflow: hidden; }
  .cg-seg { flex: 0 0 auto; width: min(50%, var(--cg-bar-w)); background: var(--cg-color, var(--oc-primary)); border-radius: calc(var(--cg-bar-w) / 16); transition: height 200ms ease-out; }
  .cg-seg.is-top { border-radius: var(--cg-bar-radius) var(--cg-bar-radius) calc(var(--cg-bar-w) / 16) calc(var(--cg-bar-w) / 16); }
  .cg-col-value { font-size: 0.625rem; font-weight: 600; font-variant-numeric: tabular-nums; text-align: center; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .cg-col-value.is-zero { font-weight: 400; color: var(--oc-muted); }
  .cg-col-day { font-size: 0.625rem; color: var(--oc-muted); text-align: center; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  .cg-cal-head { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 3px; }
  .cg-cal-dow { font-size: 0.5625rem; color: var(--oc-muted); text-align: center; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .cg-cal { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); grid-auto-rows: 30px; gap: 3px; }
  .cg-cell { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px; border-radius: 4px; background: color-mix(in oklab, var(--oc-muted) 12%, var(--oc-elevated)); color: var(--oc-fg); font-variant-numeric: tabular-nums; transition: background-color 200ms ease-out; }
  .cg-cell::before { content: attr(data-day); font-size: 0.5rem; line-height: 1; }
  .cg-cell::after { content: attr(data-cost); font-size: 0.5625rem; line-height: 1; font-weight: 600; }

  .cg-models { display: flex; flex-direction: column; gap: 7px; min-width: 0; }
  .cg-model { display: flex; flex-direction: column; gap: 3px; min-width: 0; }
  .cg-model-top { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; min-width: 0; }
  .cg-model-name { flex: 1 1 auto; font-size: 0.75rem; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .cg-model-cost { flex: 0 0 auto; font-size: 0.75rem; font-weight: 600; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .cg-model-meta { font-size: 0.625rem; color: var(--oc-muted); font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
  .cg-model-track { height: 6px; border-radius: 3px; background: var(--oc-border); overflow: hidden; }
  .cg-model-fill { height: 100%; min-width: 4px; border-radius: 3px; background: var(--cg-color, var(--oc-primary)); transition: width 200ms ease-out; }

  .cg-tip { position: fixed; z-index: 60; display: flex; flex-direction: column; gap: 2px; max-width: calc(100vw - 16px); padding: 6px 8px; border: 1px solid var(--oc-border); border-radius: var(--oc-radius); background: var(--oc-elevated); color: var(--oc-fg); box-shadow: 0 8px 24px color-mix(in oklab, var(--oc-fg) 14%, transparent); pointer-events: none; }
  .cg-tip-head { font-size: 0.6875rem; color: var(--oc-muted); font-variant-numeric: tabular-nums; }
  .cg-tip-model { font-size: 0.75rem; font-weight: 600; overflow-wrap: anywhere; }
  .cg-tip-line { font-size: 0.6875rem; color: var(--oc-muted); font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }

  @media (prefers-reduced-motion: reduce) {
    .cg-seg, .cg-cell, .cg-model-fill { transition: none; }
  }

  .cg-foot { display: flex; flex-direction: column; gap: 4px; }
  .cg-foot-row { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .cg-foot-note { font-size: 0.6875rem; color: var(--oc-muted); font-variant-numeric: tabular-nums; }

  .cg-state { padding-top: 8px; }
</style>
</head>
<body>
  <div id="root"></div>
  <script src="./main.js"></script>
</body>
</html>
